services:
  redis:
    image: redis:{{redis_version}}
    restart: always
    # Cache and sessions only. Without this, the image's `VOLUME /data` creates a new anonymous volume per container
    tmpfs:
      - /data
    healthcheck:
      test: "redis-cli ping"
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10
